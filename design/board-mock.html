    · The content layer — canvas, task cards, inspector — uses opaque standard surfaces.
  Colours below stand in for macOS dynamic system colours (labelColor, separatorColor,
  controlBackgroundColor, controlAccentColor, systemGreen…). In the SwiftUI build these

  --separator:rgba(0,0,0,.11);
  --accent:#007AFF;
  --green:#28CD41; --orange:#FF9500; --red:#FF3B30; --gray:#8E8E93;
  --glass-tint:rgba(246,246,246,.62);
  --glass-edge:rgba(255,255,255,.7);
  --glass-shade:rgba(0,0,0,.06);
  --window-shadow:0 26px 60px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18);
  --float-shadow:0 6px 18px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.10);

}

  --accent:#0A84FF;

*{box-sizing:border-box}
body{margin:0;color:var(--label);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  background:

    radial-gradient(100% 80% at 88% 96%, var(--desktop-c) 0%, transparent 52%),

.page{padding:30px 16px 34px;display:flex;flex-direction:column;gap:16px;align-items:center}

/* Liquid Glass, regular variant: blurs and lifts the luminosity of what passes under it,
   with a specular top edge and a shaded bottom edge. Never used on the content layer. */
.glass{
  background:var(--glass-tint);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 .5px 0 var(--glass-edge), inset 0 -.5px 0 var(--glass-shade);
}

.window{width:100%;max-width:1200px;border-radius:13px;overflow:hidden;
  box-shadow:var(--window-shadow);background:transparent;
  border:.5px solid var(--separator)}

/* ---- unified toolbar (functional layer) ---- */
.toolbar{position:relative;z-index:3;display:flex;align-items:center;gap:12px;
  height:46px;padding:0 13px;border-bottom:.5px solid var(--separator)}
.lights{display:flex;gap:8px;margin-right:4px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}
.lights i:nth-child(3){background:#28C840}
.doc{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px}
.doc .t{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.doc .s{font-size:11px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
/* Segmented control — a system component, so it sits on the glass without its own material. */
.seg{display:flex;background:var(--fill-tertiary);border-radius:7px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:12px;
  color:var(--label);padding:3px 12px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);font-weight:590;
  box-shadow:0 1px 2px rgba(0,0,0,.14), inset 0 .5px 0 var(--glass-edge)}
.seg button:focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 55%,transparent);
  outline-offset:1px}
.serve{display:flex;align-items:center;gap:6px;font:11px/1 var(--mono);color:var(--label-2);
  padding:4px 9px;border-radius:7px;background:var(--fill-quaternary)}
.serve .beacon{width:6px;height:6px;border-radius:50%;background:var(--green)}

.body{display:grid;grid-template-columns:225px minmax(0,1fr) 300px;height:600px}

/* ---- sidebar (functional layer: glass, per HIG's own example) ---- */
.sidebar{position:relative;z-index:2;display:flex;flex-direction:column;
  border-right:.5px solid var(--separator);overflow:hidden}
.side-head{padding:12px 14px 6px;font-size:11px;font-weight:600;color:var(--label-2)}
.runs{display:flex;flex-direction:column;gap:2px;padding:0 8px 10px;overflow-y:auto}
/* macOS sidebar selection: an inset rounded fill in the accent colour, not a coloured rail. */
.run{appearance:none;border:0;background:none;text-align:left;font:inherit;color:var(--label);
  padding:7px 9px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.run:hover{background:var(--fill-quaternary)}
.run[aria-current="true"]{background:var(--accent);color:#fff}
.run[aria-current="true"] .p,.run[aria-current="true"] .m{color:rgba(255,255,255,.78)}
.run:focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.run .glyph{flex:none;margin-top:1px}
.run .body-col{min-width:0;display:flex;flex-direction:column;gap:1px}
.run .t{font-size:13px;font-weight:590;letter-spacing:-.01em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.run .p{font:10.5px/1.35 var(--mono);color:var(--label-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.run .m{font-size:11px;color:var(--label-2);font-variant-numeric:tabular-nums;margin-top:2px}

/* ---- content layer: opaque, no glass ---- */
.main{position:relative;background:var(--content-bg);overflow:hidden;display:flex;flex-direction:column}
.canvas{flex:1;overflow:auto;padding:14px 18px 62px;scroll-padding-top:14px}
/* Scroll edge effect: content fades as it passes beneath the floating cluster. */
.main::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;pointer-events:none;
  background:linear-gradient(to top,var(--content-bg) 18%,transparent);z-index:1}

.stage{position:relative;display:flex;gap:54px;align-items:flex-start;width:max-content;min-width:100%}
.stage>svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.layer{display:flex;flex-direction:column;gap:9px;position:relative;z-index:1}
.layer-label{font-size:11px;color:var(--label-3);padding:0 2px 3px;font-variant-numeric:tabular-nums}

/* Task card: an opaque content-layer surface. Status is carried by a symbol and a word,
   not by a coloured edge — HIG: "Avoid relying solely on color to ... communicate
   essential information ... use text labels or glyph shapes to identify objects or states." */
.card{width:190px;appearance:none;text-align:left;font:inherit;color:var(--label);cursor:pointer;
  background:var(--raised);border:.5px solid var(--separator);border-radius:8px;
  padding:8px 10px 9px;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 1px 1.5px rgba(0,0,0,.05)}
.card:hover{background:color-mix(in srgb,var(--label) 4%,var(--raised))}
.card:focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.card .top{display:flex;align-items:center;gap:5px}
.card .id{font:10.5px/1.4 var(--mono);color:var(--label-2);letter-spacing:-.01em}
.card .state{margin-left:auto;font-size:11px;color:var(--label-2)}
.card .title{font-size:12px;line-height:16px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .who{font-size:11px;color:var(--label-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.is-selected{border-color:color-mix(in srgb,var(--accent) 70%,transparent);
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--accent) 25%,transparent)}
.stage.has-selection .card:not(.is-selected):not(.is-related){opacity:.32}
.glyph{width:14px;height:14px;flex:none;display:block}
.spin{transform-origin:7px 7px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* floating control cluster over the canvas — glass, because it is a control */
.float{position:absolute;left:18px;bottom:14px;z-index:2;display:flex;align-items:center;gap:10px;
  padding:6px 11px;border-radius:11px;box-shadow:var(--float-shadow);font-size:11px;color:var(--label-2)}
.float .k{display:flex;align-items:center;gap:5px}
.float .sep{width:.5px;height:14px;background:var(--separator)}

/* status columns */
.columns{display:grid;grid-template-columns:repeat(5,minmax(172px,1fr));gap:14px;min-width:max-content}
.col-head{display:flex;align-items:center;gap:6px;padding:0 2px 7px;
  border-bottom:.5px solid var(--separator);margin-bottom:9px}
.col-head .nm{font-size:11px;font-weight:600}
.col-head .n{margin-left:auto;font:11px/1 var(--mono);color:var(--label-2);font-variant-numeric:tabular-nums}
.col-list{display:flex;flex-direction:column;gap:8px}
.col-empty{font-size:11px;color:var(--label-3);padding:5px 2px}

/* ---- inspector: content layer, opaque ---- */
.inspector{background:var(--control-bg);border-left:.5px solid var(--separator);
  overflow-y:auto;min-width:0}
.insp-head{padding:13px 15px 11px;border-bottom:.5px solid var(--separator)}
.insp-head .id{font:11px/1.4 var(--mono);color:var(--label-2)}
.insp-head h2{margin:2px 0 0;font-size:15px;font-weight:600;line-height:20px;letter-spacing:-.01em}
.insp-head .row{margin-top:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px 2px 6px;
  border-radius:6px;background:var(--fill-quaternary);color:var(--label-2)}
.field{padding:10px 15px;border-bottom:.5px solid var(--separator)}
.field h3{margin:0 0 5px;font-size:11px;color:var(--label-2);font-weight:400}
.field p{margin:0;font-size:12px;line-height:18px}
.vals{display:flex;flex-wrap:wrap;gap:4px}
.val{font:10.5px/1.5 var(--mono);padding:2px 6px;border-radius:5px;background:var(--fill-quaternary);
  color:var(--label);word-break:break-all}
.val.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,transparent)}
.none{font-size:12px;color:var(--label-3)}
.log{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{list-style:none;display:grid;grid-template-columns:42px minmax(0,1fr);gap:9px;
  font-size:11.5px;line-height:16px}
.log time{font:10.5px/16px var(--mono);color:var(--label-3);font-variant-numeric:tabular-nums}
.log .what{color:var(--label-2)}
.log .what b{color:var(--label);font-weight:590}

.caption{max-width:1200px;width:100%;display:flex;gap:22px;flex-wrap:wrap;
  font-size:11.5px;line-height:17px;color:rgba(255,255,255,.62)}
.caption div{flex:1 1 250px}
.caption b{color:rgba(255,255,255,.92);font-weight:600;display:block;margin-bottom:3px;font-size:11px}

@media (max-width:920px){
  .body{grid-template-columns:1fr;height:auto}
  .sidebar{border-right:0;border-bottom:.5px solid var(--separator)}
  .runs{flex-direction:row;padding-bottom:10px}
  .run{min-width:212px}

</style>

/* SF Symbols stand-ins. Each is the symbol the SwiftUI build will ask for by name,
   drawn here because SF Symbols is not a webfont. Shape carries the state; colour
   only reinforces it. */
const SYMBOL={
  done:{name:"checkmark.circle.fill",color:"var(--green)",
    d:'<circle cx="7" cy="7" r="6.1" fill="currentColor"/><path d="M4.3 7.2 6.2 9.1 9.8 5.2" fill="none" stroke="var(--raised)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'},
  running:{name:"progress.indicator",color:"var(--accent)",
    d:'<circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1.6"/><path class="spin" d="M7 1.5a5.5 5.5 0 0 1 5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
  review:{name:"exclamationmark.circle.fill",color:"var(--orange)",
    d:'<circle cx="7" cy="7" r="6.1" fill="currentColor"/><path d="M7 3.6v4.1" fill="none" stroke="var(--raised)" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10.1" r=".95" fill="var(--raised)"/>'},
  blocked:{name:"exclamationmark.octagon.fill",color:"var(--red)",
    d:'<path d="M4.9 1.1h4.2L12.9 4.9v4.2L9.1 12.9H4.9L1.1 9.1V4.9z" fill="currentColor"/><path d="M4.8 4.8l4.4 4.4M9.2 4.8 4.8 9.2" fill="none" stroke="var(--raised)" stroke-width="1.5" stroke-linecap="round"/>'},
  ready:{name:"arrow.right.circle",color:"var(--accent)",
    d:'<circle cx="7" cy="7" r="6.1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.6 7h4.6M7.3 5.1 9.2 7l-1.9 1.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>'},
  upstream_blocked:{name:"circle.dashed",color:"var(--gray)",
    d:'<circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2.1 2.5"/>'},
  resource_blocked:{name:"lock.circle.fill",color:"var(--orange)",
    d:'<circle cx="7" cy="7" r="6.1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4.4" y="6.6" width="5.2" height="4" rx="1.1" fill="currentColor"/><path d="M5.6 6.6V5.5a1.4 1.4 0 0 1 2.8 0v1.1" fill="none" stroke="currentColor" stroke-width="1.2"/>'},
  pending:{name:"circle",color:"var(--gray)",
    d:'<circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/>'}
};
const STATE_LABEL={pending:"等上游",ready:"就绪",running:"执行中",review:"待复核",blocked:"阻塞",
  done:"完成",upstream_blocked:"等上游",resource_blocked:"资源占用"};
const COLUMNS=[["pending","待开始"],["running","执行中"],["review","待复核"],["blocked","阻塞"],["done","已完成"]];

let runIndex=0, view="dag", selected=null;
const el=id=>document.getElementById(id);

function icon(state,size=14){
  const sym=SYMBOL[state]||SYMBOL.pending;
  return `<svg class="glyph" viewBox="0 0 14 14" width="${size}" height="${size}" aria-hidden="true"
    style="color:${sym.color}">${sym.d}</svg>`;
}

/* Mirrors BoardKit.deriveGraph: layers, ready set, transitive blockers, resource conflicts. */
function project(run){
  const byId=new Map(run.tasks.map(t=>[t.id,t]));
  const deps=new Map(run.tasks.map(t=>[t.id,t.dep.filter(d=>byId.has(d))]));
  const dependents=new Map(run.tasks.map(t=>[t.id,[]]));
  deps.forEach((ps,c)=>ps.forEach(p=>dependents.get(p).push(c)));
  const waiting=new Map(run.tasks.map(t=>[t.id,deps.get(t.id).filter(d=>byId.get(d).s!=="done")]));

  const rank=new Map(run.tasks.map((t,i)=>[t.id,i])), left=new Set(byId.keys()), layers=[];
  while(left.size){
    const layer=[...left].filter(id=>deps.get(id).every(p=>!left.has(p)));
    if(!layer.length){layers.push([...left]);break}
    layer.sort((a,b)=>rank.get(a)-rank.get(b));
    layers.push(layer); layer.forEach(id=>left.delete(id));
  }

  const blockers=new Map();
  layers.flat().forEach(id=>{
    const set=new Set();
    deps.get(id).forEach(d=>{if(byId.get(d).s!=="done"){set.add(d);(blockers.get(d)||[]).forEach(x=>set.add(x))}});
    blockers.set(id,[...set].sort((a,b)=>rank.get(a)-rank.get(b)));
  });

  const holders=run.tasks.filter(t=>t.s==="running"||t.s==="review").map(t=>t.id);
  const conflicts=new Map(run.tasks.map(t=>[t.id,[]]));
  run.tasks.forEach(t=>{
    if(!t.xr.length) return;
    holders.forEach(h=>{
      if(h===t.id) return;
      const overlap=t.xr.filter(r=>byId.get(h).xr.includes(r));
      if(overlap.length) conflicts.get(t.id).push({id:h,res:overlap});
    });
  });

  const ready=new Set(run.tasks.filter(t=>t.s==="pending"&&!waiting.get(t.id).length
    &&!conflicts.get(t.id).length).map(t=>t.id));
  return {byId,deps,dependents,waiting,layers,blockers,conflicts,ready};
}

function stateOf(task,g){
  if(["done","running","review","blocked"].includes(task.s)) return task.s;
  if(g.blockers.get(task.id).length) return "upstream_blocked";
  if(g.conflicts.get(task.id).length) return "resource_blocked";
  return g.ready.has(task.id)?"ready":"pending";
}

function related(g,id){
  const up=new Set(), down=new Set();
  const walk=(cur,src,into)=>(src.get(cur)||[]).forEach(n=>{if(!into.has(n)){into.add(n);walk(n,src,into)}});
  if(id){walk(id,g.deps,up);walk(id,g.dependents,down)}
  return new Set([...up,...down]);
}

function tail(path,keep=2){
  const parts=path.split("/").filter(Boolean);
  return parts.length<=keep?path:"…/"+parts.slice(-keep).join("/");
}

function renderSidebar(){
  el("runs").replaceChildren(...RUNS.map((run,i)=>{
    const done=run.tasks.filter(t=>t.s==="done").length;
    const b=document.createElement("button");
    b.type="button"; b.className="run"; b.setAttribute("aria-current",String(i===runIndex));
    b.innerHTML=`${icon("running",13)}<span class="body-col">
      <span class="t">${run.title}</span>
      <span class="p">${tail(run.project)}</span>
      <span class="m">${done} / ${run.tasks.length} 完成</span></span>`;
    b.onclick=()=>{runIndex=i;selected=null;render()};
    return b;
  }));
}

function renderToolbar(run,g){
  el("run-title").textContent=run.title;
  const active=run.tasks.filter(t=>t.s==="running"||t.s==="review").length;
  const done=run.tasks.filter(t=>t.s==="done").length;
  el("run-sub").textContent=
    `${run.project} · 完成 ${done}/${run.tasks.length} · 活动 ${active} · 就绪 ${g.ready.size}`;
  el("float").innerHTML=
    `<span class="k">${icon("ready",12)}就绪 ${g.ready.size}</span><span class="sep"></span>
     <span class="k">${icon("running",12)}活动 ${active}</span><span class="sep"></span>
     <span class="k">${g.layers.length} 个并行层</span>`;
}

function card(task,g){
  const state=stateOf(task,g);
  const b=document.createElement("button");
  b.type="button"; b.className="card"; b.dataset.taskId=task.id;
  const meta=task.who||(g.waiting.get(task.id).length?`等 ${g.waiting.get(task.id).length} 项上游`
    :state==="ready"?"可立即派发":"未指派");
  b.innerHTML=`<span class="top">${icon(state)}<span class="id">${task.id}</span>
      <span class="state">${STATE_LABEL[state]}</span></span>
    <span class="title">${task.t}</span><span class="who">${meta}</span>`;
  b.onclick=()=>{selected=selected===task.id?null:task.id;render()};
  return b;
}

function renderDag(run,g,canvas){
  const stage=document.createElement("div");
  stage.className="stage"+(selected?" has-selection":"");
  const kin=related(g,selected), nodes=new Map();
  g.layers.forEach((ids,i)=>{
    const col=document.createElement("div"); col.className="layer";
    const label=document.createElement("div"); label.className="layer-label";
    label.textContent=`第 ${i+1} 层 · ${ids.length} 个可并行`;
    col.append(label);
    ids.forEach(id=>{
      const c=card(g.byId.get(id),g);
      if(id===selected) c.classList.add("is-selected");
      if(kin.has(id)) c.classList.add("is-related");
      col.append(c); nodes.set(id,c);
    });
    stage.append(col);
  });
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","edges");
  stage.append(svg); canvas.replaceChildren(stage);

  const base=stage.getBoundingClientRect();
  g.deps.forEach((parents,child)=>parents.forEach(parent=>{
    const a=nodes.get(parent)?.getBoundingClientRect(), b=nodes.get(child)?.getBoundingClientRect();
    if(!a||!b) return;
    const x1=a.right-base.left, y1=a.top-base.top+a.height/2;
    const x2=b.left-base.left, y2=b.top-base.top+b.height/2, mid=(x1+x2)/2;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`);
    const lit=selected&&(parent===selected||child===selected);
    path.setAttribute("fill","none");
    path.setAttribute("stroke",lit?"var(--accent)":"var(--label-3)");
    path.setAttribute("stroke-width",lit?"1.75":"1");
    if(selected&&!lit) path.setAttribute("opacity",".3");
    svg.append(path);
  }));
}

function renderBoard(run,g,canvas){
  const wrap=document.createElement("div"); wrap.className="columns";
  COLUMNS.forEach(([status,label])=>{
    const items=run.tasks.filter(t=>{
      const s=stateOf(t,g);
      return status==="pending"
        ?["pending","ready","upstream_blocked","resource_blocked"].includes(s):s===status;
    });
    const col=document.createElement("section");
    col.innerHTML=`<div class="col-head">${icon(status,13)}<span class="nm">${label}</span>
      <span class="n">${String(items.length).padStart(2,"0")}</span></div>`;
    const list=document.createElement("div"); list.className="col-list";
    if(!items.length) list.innerHTML=`<div class="col-empty">暂无</div>`;
    items.forEach(t=>{
      const c=card(t,g);
      if(t.id===selected) c.classList.add("is-selected");
      list.append(c);
    });
    col.append(list); wrap.append(col);
  });
  canvas.replaceChildren(wrap);
}

function values(list,cls="val"){
  if(!list.length) return `<span class="none">—</span>`;
  return `<div class="vals">${list.map(v=>`<span class="${cls}">${v}</span>`).join("")}</div>`;
}

function renderInspector(run,g){
  const box=el("inspector");
  if(!selected||!g.byId.has(selected)){
    box.innerHTML=`<div class="insp-head"><div class="id">${run.id.slice(0,10)}</div>
        <h2>运行概览</h2>
        <div class="row"><span class="pill">${icon("running",12)}执行中</span>
          <span class="pill">${g.layers.length} 层</span></div></div>
      <div class="field"><h3>摘要</h3><p>${run.summary}</p></div>
      <div class="field"><h3>最近活动</h3><ul class="log">${run.events.map(e=>
        `<li><time>${e.at}</time><span class="what">${e.task?`<b>${e.task}</b> `:""}${e.what} — ${e.note}</span></li>`
      ).join("")}</ul></div>
      <div class="field"><h3>提示</h3><p class="none">选中任务后，这里显示它的依赖、写入范围与独占资源。</p></div>`;
    return;
  }
  const task=g.byId.get(selected), state=stateOf(task,g), conflicts=g.conflicts.get(task.id);
  box.innerHTML=`
    <div class="insp-head">
      <div class="id">${task.id}</div>
      <h2>${task.t}</h2>
      <div class="row"><span class="pill">${icon(state,12)}${STATE_LABEL[state]}</span>
        <span class="pill">${task.who||"未指派"}</span></div>
    </div>
    <div class="field"><h3>进展</h3>${task.d?`<p>${task.d}</p>`:`<p class="none">尚无记录</p>`}</div>
    <div class="field"><h3>依赖</h3>${values(task.dep)}</div>
    <div class="field"><h3>仍在等待</h3>${values(g.waiting.get(task.id))}</div>
    <div class="field"><h3>写入范围</h3>${values(task.ws)}</div>
    <div class="field"><h3>独占资源</h3>${values(task.xr,conflicts.length?"val warn":"val")}</div>
    ${conflicts.length?`<div class="field"><h3>资源冲突</h3>
      ${values(conflicts.map(c=>`${c.id} · ${c.res.join(" / ")}`),"val warn")}</div>`:""}
    <div class="field"><h3>下游</h3>${values(g.dependents.get(task.id))}</div>`;
}

function render(){
  const run=RUNS[runIndex], g=project(run);
  renderSidebar(); renderToolbar(run,g);
  el("view-dag").setAttribute("aria-pressed",String(view==="dag"));
  el("view-board").setAttribute("aria-pressed",String(view==="board"));
  const canvas=el("canvas");
  view==="dag"?renderDag(run,g,canvas):renderBoard(run,g,canvas);
  renderInspector(run,g);
}

el("view-dag").onclick=()=>{view="dag";render()};
el("view-board").onclick=()=>{view="board";render()};
render();
</script>

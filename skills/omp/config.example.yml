# Example omp config for the plan-sdd skill. Copy the parts you want into
# ~/.omp/agent/config.yml, or into <project>/.omp/config.yml for one repository.
# Every alias below is used by skills/omp/agents/*.md (model: "@alias") and by
# the "Roles and models" table in skills/omp/SKILL.md. The model ids are
# examples; put your own provider/model ids here, they are the only thing to
# retune. After copying, check that every @sdd-* alias the agent files use is
# defined under modelRoles: omp passes an undefined alias on as a literal model
# pattern instead of failing.

modelRoles:
  # recon: one survey per run. It also sets the product boundary, so strong tier.
  sdd-recon: anthropic/opus-5.5
  # implementer: one per task.
  sdd-implementer: openai/gpt-6.1-sol
  # plan-reviewer (the reviewer role): the independent check on every node.
  sdd-reviewer: anthropic/opus-5.5
  # qa: runs the change for tasks marked [qa].
  sdd-qa: openai/gpt-6.1-sol
  # adversary: one pass over the branch review, in phase 3.
  sdd-adversary: anthropic/opus-5.5

compaction:
  # Keep any threshold well above what the skill reads at start. On the earlier,
  # larger version of this skill, thresholdTokens: 30000 made omp roll over 18
  # times in 2m10s and pause automatic maintenance, and 70000 did not loop
  # (docs/e2e/2026-10-16-omp-e2e.md, F4). This version reads far less at start
  # and has not been re-measured; 70000 or more remains the safe choice.
  #
  # Cap a long run at 500k tokens: compaction.modelThresholds keys a model id to
  # a fixed trigger "f500000" (a bare number is a base the policy scales, not a
  # cap), or set thresholdTokens for every model.
  # modelThresholds:
  #   openai/gpt-6.1-sol: "f500000"
  #   anthropic/opus-5.5: "f500000"
  # thresholdTokens: 500000
  #
  # Recommended for long runs. It trades summary guidance on automatic
  # compaction for Pins (context_notes); see plugins/omp-context/README.md.
  experimentalContextManagement: true
